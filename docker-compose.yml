services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: url-shortener-app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - redis

  redis:
    image: redis:7-alpine

    container_name: url-shortener-redis

    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
