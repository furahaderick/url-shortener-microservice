[project]
name = "url-shortener-service"
version = "0.1.0"
description = ""
authors = [
    {name = "furahayves",email = "yvesderricks@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard] (>=0.162.0,<0.163.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "redis[hiredis] (>=8.1.0,<9.0.0)",
    "nanoid (>=2.0.0,<3.0.0)",
    "psycopg[binary] (>=3.3.8,<4.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "sqlalchemy[asyncio] (>=2.1.8,<3.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "pwdlib[argon2] (>=0.4.2,<0.5.0)",
    "fastapi-limiter (>=0.2.0,<0.3.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.5.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "testcontainers[postgres,redis] (>=4.15.0,<5.0.0)",
    "asgi-lifespan (>=2.1.0,<3.0.0)"
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
